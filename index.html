
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galpão do Gelo | PDV</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;color:#172033;font-family:Arial,sans-serif}
header{background:#102b46;color:white;padding:20px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px}
header h1{margin:0;font-size:22px}
main{max-width:1050px;margin:25px auto;padding:0 16px}
.card{background:white;border-radius:12px;padding:22px;margin-bottom:18px;box-shadow:0 3px 12px #0000000b}
input,select,button{padding:12px;border:1px solid #cbd5e1;border-radius:7px;font-size:15px;width:100%;margin:5px 0}
button{background:#087e8b;color:white;border:0;font-weight:bold;cursor:pointer}
button.secondary{background:#e2e8f0;color:#172033}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.hidden{display:none}
.muted{color:#64748b;font-size:14px}
table{border-collapse:collapse;width:100%;min-width:570px}
th,td{text-align:left;padding:11px;border-bottom:1px solid #e2e8f0}
.tablewrap{overflow-x:auto}
#msg{padding:10px 0;overflow-wrap:anywhere}
@media(max-width:600px){.grid{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header>
  <div>
    <h1>🧊 Galpão do Gelo</h1>
    <div>Vendas e controle comercial</div>
  </div>
  <button id="logout" class="secondary hidden" style="width:auto">Sair</button>
</header>

<main>
  <p id="msg" role="status">Conectando ao sistema...</p>

  <section id="login" class="card hidden">
    <h2>Entrar no sistema</h2>
    <p class="muted">Use o e-mail e a senha cadastrados no Supabase.</p>
    <form id="loginForm">
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Senha</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit">Entrar</button>
    </form>
  </section>

  <section id="app" class="hidden">
    <div class="card">
      <h2>Cadastro de produtos</h2>
      <form id="productForm">
        <label for="nome">Nome do produto *</label>
        <input id="nome" required maxlength="120" placeholder="Ex.: Gelo em cubos">
        <div class="grid">
          <div>
            <label for="codigo">Código (opcional)</label>
            <input id="codigo" maxlength="60" placeholder="Código do produto">
          </div>
          <div>
            <label for="categoria">Categoria</label>
            <input id="categoria" maxlength="80" placeholder="Ex.: Gelo">
          </div>
          <div>
            <label for="unidade">Unidade de venda</label>
            <select id="unidade">
              <option value="unidade">Unidade</option>
              <option value="pacote">Pacote</option>
              <option value="saco">Saco</option>
              <option value="kg">Quilograma (kg)</option>
              <option value="litro">Litro</option>
              <option value="caixa">Caixa</option>
            </select>
          </div>
          <div>
            <label for="preco">Preço de venda (R$) *</label>
            <input id="preco" type="number" min="0" step="0.01" required>
          </div>
          <div>
            <label for="custo">Custo (R$)</label>
            <input id="custo" type="number" min="0" step="0.01" value="0">
          </div>
          <div>
            <label for="estoque">Estoque inicial</label>
            <input id="estoque" type="number" min="0" step="0.001" value="0">
          </div>
        </div>
        <button type="submit">Cadastrar produto</button>
      </form>
    </div>

    <div class="card">
      <h2>Produtos cadastrados</h2>
      <button id="refresh" class="secondary">Atualizar lista</button>
      <div class="tablewrap">
        <table>
          <thead><tr><th>Produto</th><th>Unidade</th><th>Preço</th><th>Estoque</th></tr></thead>
          <tbody id="products"></tbody>
        </table>
      </div>
      <p id="empty" class="muted"></p>
    </div>

    <div class="card">
      <h2>Calculadora</h2>
      <div class="grid">
        <input id="a" type="number" placeholder="Primeiro valor">
        <input id="b" type="number" placeholder="Segundo valor">
      </div>
      <div class="grid">
        <button type="button" onclick="calc('+')">Somar +</button>
        <button type="button" onclick="calc('-')">Subtrair −</button>
        <button type="button" onclick="calc('*')">Multiplicar ×</button>
        <button type="button" onclick="calc('/')">Dividir ÷</button>
      </div>
      <h3 id="result">Resultado: 0</h3>
    </div>
  </section>
</main>

<script>
const SUPABASE_URL = 'https://ctnvhmutwofaoixgxqca.supabase.co';
const SUPABASE_KEY = 'COLE_SUA_CHAVE_PUBLICA_AQUI';

const msg = document.getElementById('msg');
const login = document.getElementById('login');
const app = document.getElementById('app');
const logout = document.getElementById('logout');

let db;

function message(text) {
  msg.textContent = text;
}

function money(value) {
  return Number(value).toLocaleString('pt-BR',{
    style:'currency',currency:'BRL'
  });
}

function calc(op) {
  const a = Number(document.getElementById('a').value || 0);
  const b = Number(document.getElementById('b').value || 0);
  if (op === '/' && b === 0) {
    document.getElementById('result').textContent =
      'Não é possível dividir por zero.';
    return;
  }
  const r = op === '+' ? a+b : op === '-' ? a-b :
            op === '*' ? a*b : a/b;
  document.getElementById('result').textContent =
    'Resultado: ' + r.toLocaleString('pt-BR');
}
window.calc = calc;

async function showSession() {
  const {data,error} = await db.auth.getSession();
  if (error) {
    message('Erro ao verificar login: ' + error.message);
    return;
  }
  const session = data.session;
  login.classList.toggle('hidden',!!session);
  app.classList.toggle('hidden',!session);
  logout.classList.toggle('hidden',!session);

  if (!session) {
    message('Entre com seu e-mail e senha.');
    return;
  }

  const {data:profile,error:profileError} = await db
    .from('profiles')
    .select('nome,role')
    .eq('id',session.user.id)
    .maybeSingle();

  if (profileError) {
    message('Login feito, mas não consegui consultar seu perfil. Confira as políticas da tabela profiles.');
    return;
  }
  if (!profile || !['admin','gerente'].includes(profile.role)) {
    message('Seu perfil não tem permissão para cadastrar produtos. Confira o perfil de administrador no Supabase.');
    return;
  }

  message('Bem-vindo, ' + (profile.nome || 'Administrador') + '!');
  await loadProducts();
}

document.getElementById('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  message('Entrando...');
  const {error} = await db.auth.signInWithPassword({
    email:document.getElementById('email').value.trim(),
    password:document.getElementById('password').value
  });
  if(error) {
    message('Não foi possível entrar: ' + error.message);
    return;
  }
  await showSession();
});

logout.addEventListener('click',async()=>{
  const {error} = await db.auth.signOut();
  if(error) message('Erro ao sair: ' + error.message);
  else await showSession();
});

async function loadProducts() {
  const body = document.getElementById('products');
  body.replaceChildren();
  document.getElementById('empty').textContent='Carregando...';

  const {data,error} = await db.from('products')
    .select('id,nome,codigo,unidade,preco,estoque')
    .eq('ativo',true)
    .order('nome');

  if(error) {
    document.getElementById('empty').textContent='';
    message('Erro ao carregar produtos: ' + error.message);
    return;
  }

  document.getElementById('empty').textContent =
    data.length ? '' : 'Nenhum produto cadastrado ainda.';

  data.forEach(p=>{
    const tr=document.createElement('tr');
    [p.nome,p.unidade,money(p.preco),p.estoque].forEach(value=>{
      const td=document.createElement('td');
      td.textContent=String(value ?? '');
      tr.appendChild(td);
    });
    body.appendChild(tr);
  });
}

document.getElementById('refresh').addEventListener('click',loadProducts);

document.getElementById('productForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const button=e.submitter;
  button.disabled=true;
  message('Salvando produto...');

  const product={
    nome:document.getElementById('nome').value.trim(),
    codigo:document.getElementById('codigo').value.trim() || null,
    categoria:document.getElementById('categoria').value.trim() || null,
    unidade:document.getElementById('unidade').value,
    preco:Number(document.getElementById('preco').value),
    custo:Number(document.getElementById('custo').value || 0),
    estoque:Number(document.getElementById('estoque').value || 0)
  };

  try {
    const {error}=await db.from('products').insert(product);
    if(error) {
      message('Não foi possível salvar: ' + error.message);
      return;
    }
    e.target.reset();
    document.getElementById('custo').value='0';
    document.getElementById('estoque').value='0';
    message('Produto cadastrado com sucesso!');
    await loadProducts();
  } finally {
    button.disabled=false;
  }
});

async function start() {
  if (!window.supabase) {
    message('Não foi possível carregar a biblioteca do sistema. Atualize a página.');
    return;
  }
  if (SUPABASE_KEY === 'COLE_SUA_CHAVE_PUBLICA_AQUI') {
    message('Falta configurar a chave pública do Supabase no código.');
    login.classList.remove('hidden');
    return;
  }
  db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  await showSession();
  db.auth.onAuthStateChange(()=>setTimeout(showSession,0));
}

start();
</script>
</body>
</html>
